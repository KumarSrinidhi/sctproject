[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-tc"
version = "0.2.0"
description = "ARGUS: source-verified thermal conductivity dataset and toolkit for polymer-ceramic composites (epoxy + BN/AlN)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Code: MIT. Data: see README (values extracted from open-access sources)." }
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
plots = ["matplotlib>=3.7"]
# GroupKFold(shuffle=True) needs scikit-learn >= 1.6
ml = ["scikit-learn>=1.6", "xgboost>=2.0", "matplotlib>=3.7"]

[project.scripts]
argus = "argus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argus = ["reference/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
