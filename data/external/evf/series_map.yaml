# How each EVF series maps onto ARGUS (curated by hand from the workbook's own
# columns; nothing here changes a measured value).
#
#   filler / matrix   ARGUS labels (filler normalized, matrix as a free-text description)
#   doi               source paper, resolved from the EVF citation via Crossref (2026-10-25)
#   paper             grouping key for paper-level validation when the DOI is a compilation
#   direction         ARGUS vocabulary (in-plane | through-plane | isotropic | unknown)
#   shape, size_um, alignment, treatment, processing   as stated in the workbook
#   notes             caveats carried into every row
#
# Points at Vf = 0 (neat matrix) are never test points; they are only used to check
# that the series' k_matrix matches its own zero-loading point.
#
# Excluded series keep their reason so the selection can be audited.

