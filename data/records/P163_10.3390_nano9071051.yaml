  notes: '0.413 is printed only as Kp, the polymer-substrate input to the Agari model (the sentence ends with citation [49], which may refer to the filler value of 350 or to both). The paper never states 0.413 as the measured pure CNF film k. It reproduces the stated enhancements exactly (1.488/0.413 = +260.3%; 0.678/0.413 = +64.2%), so it is very likely the measured pure CNF film. The paper says the neat-film diffusivity was 0.268 mm2·s−1 ''regardless of preparation method''. Corrected in verification: The quote is verbatim, but it prints 0.413 as a model parameter, not as an explicit measurement, and the attached citation makes its origin ambiguous. The row is kept because the numeric consistency is strong, but confidence is downgraded to Medium.'
