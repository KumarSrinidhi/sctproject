# Dataset-level metadata. Bump `version` (semver) with every data release and
# add an entry to data/CHANGELOG.md.
#   major: schema change that breaks readers
#   minor: rows added/removed or values corrected
#   patch: metadata/notes only
name: argus-polymer-ceramic-thermal-conductivity
title: Source-verified thermal conductivity of BN- and AlN-filled polymer composites
version: 1.2.0
released: '2026-10-25'
description: >-
  Experimental effective thermal conductivity of polymer composites filled with h-BN,
  BN nanosheets or AlN, alone or in hybrids, most often in epoxy (thermal interface
  and packaging materials). Every row cites its source paper (DOI) and quotes the table, sentence
  or figure the value comes from, in an open-access full text or, for a few rows, a publicly
  available abstract. No value is back-calculated or model-predicted; values read from figures are
  pixel-digitized and, like abstract-only values, marked Medium confidence.
homepage: https://github.com/KumarSrinidhi/sctproject
