name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,ml,report]"
      - name: Validate records
        run: argus validate
      - name: Tests
        run: pytest
      - name: Release invariants (published files must equal a fresh build)
        run: argus verify
